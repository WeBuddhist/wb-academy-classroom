# Postgres for local development.
#
#   docker compose -f infra/docker-compose.dev.yml up -d
#
# Port 55432 rather than 5432, so this never collides with a Postgres already running
# on the machine. Matches the DATABASE_URL in .env.example.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: wbac
    ports:
      - '55432:5432'
    volumes:
      - wbac-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d wbac']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wbac-pgdata:
